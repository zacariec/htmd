name: Release

# Configure an npm publishing token for the @zacariec scope as NPM_TOKEN.
# Push a v* prerelease tag only after the local verification gates pass.
# The workflow verifies, packs, publishes under alpha, then creates a GitHub
# prerelease with the same npm archives attached.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack release archives
        run: pnpm -r --filter './packages/*' pack --pack-destination release

      - name: Publish
        run: pnpm changeset publish --tag alpha
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Create GitHub prerelease
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --verify-tag --prerelease --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
